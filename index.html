<script>
/* ===== 온라인 랭킹 설정 (CONFIG) =====
   README의 "온라인 랭킹 설정" 순서대로 Supabase 프로젝트를 만들고 아래 두 값을 채우세요.
   비워 두면 같은 기기 안에서만 겨루는 오프라인 랭킹으로 동작합니다. */
window.GUMIHO_CONFIG = {
  SUPABASE_URL: '',       // 예: 'https://abcd1234.supabase.co'
  SUPABASE_ANON_KEY: ''   // Project Settings → API → anon public key
};
</script>
<style>
:root{--u:2px;--ink:#14121a;--hanji:#efe3c8;--hanji2:#d9c7a0;--red:#c8392b;--red2:#8e2419;--teal:#2f8f83;--gold:#f2c14e;--night:#1b2340}
*{box-sizing:border-box}

html,body{margin:0;height:100%;background:#0d0b12;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
body{font-family:"Galmuri11","DungGeunMo","NeoDunggeunmo","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:var(--hanji)}
#wrap{position:fixed;inset:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);display:flex;align-items:center;justify-content:center;background:#0d0b12}

#c{position:absolute;inset:0;width:100%;height:100%;image-rendering:crisp-edges;image-rendering:pixelated;touch-action:none}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--u)*10);gap:calc(var(--u)*6);background:rgba(13,11,18,.6);font-size:calc(var(--u)*7)}
.scr.see{background:linear-gradient(rgba(13,11,18,.55),rgba(13,11,18,0) 30%,rgba(13,11,18,0) 55%,rgba(13,11,18,.7));justify-content:space-between}
.logo{text-align:center;line-height:1;margin-top:calc(var(--u)*6)}
.logo b{display:block;font-size:calc(var(--u)*30);font-weight:900;color:var(--hanji);letter-spacing:calc(var(--u)*1);text-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 var(--red),calc(var(--u)*3) calc(var(--u)*3) 0 var(--ink)}
.logo small{display:block;margin-top:calc(var(--u)*5);font-size:calc(var(--u)*6.5);color:var(--gold);letter-spacing:calc(var(--u)*1.5);text-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 var(--ink)}
.panel{width:100%;max-width:calc(var(--u)*200);background:var(--hanji);color:var(--ink);border:calc(var(--u)*1.5) solid var(--ink);box-shadow:calc(var(--u)*2.5) calc(var(--u)*2.5) 0 var(--ink);padding:calc(var(--u)*9) calc(var(--u)*7) calc(var(--u)*7);position:relative}
.panel::before{content:"";position:absolute;left:0;right:0;top:0;height:calc(var(--u)*3);background:repeating-linear-gradient(90deg,var(--red) 0 calc(var(--u)*6),var(--teal) calc(var(--u)*6) calc(var(--u)*12),var(--gold) calc(var(--u)*12) calc(var(--u)*14))}
.panel h2{margin:0 0 calc(var(--u)*5);font-size:calc(var(--u)*12);font-weight:900;text-align:center}
.btn{display:block;width:100%;min-height:48px;font:inherit;font-weight:800;font-size:calc(var(--u)*8);padding:calc(var(--u)*3) calc(var(--u)*2);margin-top:calc(var(--u)*4);background:var(--red);color:var(--hanji);border:calc(var(--u)*1.2) solid var(--ink);box-shadow:0 calc(var(--u)*1.5) 0 var(--ink);border-radius:0;cursor:pointer;touch-action:manipulation}

#nickIn:focus{box-shadow:inset 0 0 0 calc(var(--u)*1) var(--gold)}

.rlist .df{font-size:calc(var(--u)*5);padding:0 calc(var(--u)*1.5);margin-right:calc(var(--u)*1.5);color:var(--hanji);background:var(--teal);font-weight:800}
.rlist .df-N{background:#b88a1e}.rlist .df-H{background:var(--red)}
.hint,.best{margin:calc(var(--u)*4) 0 0;font-size:calc(var(--u)*6);text-align:center;color:#5a4a3a}

#bSound{position:absolute;top:calc(var(--u)*5);right:calc(var(--u)*5);width:auto;min-height:40px;margin:0;padding:calc(var(--u)*2) calc(var(--u)*4);font-size:calc(var(--u)*6)}

.tag.off{background:#6b5a4a}

.rlist li.me{background:var(--gold);font-weight:900}
.rlist li.gap{display:block;text-align:center;border:0;color:#8a7a5a;padding:0}
.rlist .rk{font-weight:900;text-align:right}.rlist .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlist .tl{font-size:calc(var(--u)*5.5);color:#5a4a3a}.rlist .sc{font-weight:900;text-align:right}
.rlist .cl{color:var(--red);font-size:calc(var(--u)*5.5);font-weight:900}

#toast{position:absolute;left:50%;top:17%;transform:translateX(-50%);text-align:center;pointer-events:none;opacity:0;white-space:nowrap;z-index:5}

#toast .t1{font-size:calc(var(--u)*12);font-weight:900;color:var(--gold);text-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 var(--red2),calc(var(--u)*2) calc(var(--u)*2) 0 var(--ink)}
#toast .t2{font-size:calc(var(--u)*6.5);font-weight:700;color:var(--hanji);margin-top:calc(var(--u)*2);text-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 var(--ink)}
#toast.big .t1{font-size:calc(var(--u)*19);color:#fff1d6;text-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 var(--gold),calc(var(--u)*3) calc(var(--u)*3) 0 var(--ink)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,calc(var(--u)*6))}10%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
</style>

<body>
<div id="wrap"><div id="stage">
<canvas id="c" width="240" height="400"></canvas>
<div id="toast"><div class="t1"></div><div class="t2"></div></div>

<section id="nickScr" class="scr" hidden>
  <div class="logo"><b>아홉 꼬리</b><small>NINE TAILS · 도깨비 마을</small></div>
  <form id="nickForm" class="panel" autocomplete="off">
    <label for="nickIn" class="lbl">닉네임을 정해 주세요</label>
    <input id="nickIn" maxlength="10" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="2~10자 · 한글/영문/숫자">

    <button class="btn" type="submit">정했어요</button>

</section>

<section id="titleScr" class="scr see" hidden>
  <button class="btn sub" id="bSound" type="button">소리 켬</button>
  <div class="logo"><b>아홉 꼬리</b><small>NINE TAILS · 도깨비 마을</small></div>

    <div class="row"><button class="btn sub" id="bRank" type="button">랭킹</button><button class="btn sub" id="bNick" type="button">닉네임 변경</button></div>

    <p class="best" id="bestLine"></p>

<section id="pauseScr" class="scr" hidden>
  <div class="panel"><h2>일시정지</h2>
    <button class="btn" id="bResume" type="button">계속하기</button>
    <button class="btn sub" id="bSound2" type="button">소리 켬</button>
    <button class="btn sub" id="bQuit" type="button">처음으로</button>
  </div>
</section>

    <div class="row"><button class="btn sub" id="bRank2" type="button">랭킹</button><button class="btn sub" id="bHome" type="button">처음으로</button></div>
  </div>
</section>

</div></div>

<script>
'use strict';
// ================================================================
//  설정 · 공용 유틸
// ================================================================
const CONFIG = Object.assign({SUPABASE_URL:'',SUPABASE_ANON_KEY:''}, window.GUMIHO_CONFIG||{}, window.__GUMIHO_TEST_CONFIG__||{});
const QS = new URLSearchParams(location.search);
const DEBUG = QS.get('debug')==='1';
const TOUCH = matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window);
const TAU = Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rand=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.random()*a.length|0];
const dist2=(a,b)=>(a.x-b.x)**2+(a.y-b.y)**2;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const pickR=(R,a)=>a[(R()*a.length)|0];
const store={get(k,d){try{const v=localStorage.getItem('gumiho.'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('gumiho.'+k,JSON.stringify(v));}catch(e){}}};
const $=id=>document.getElementById(id);
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function uuid(){ if(window.crypto&&crypto.randomUUID) return crypto.randomUUID(); return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);}); }

const C={ink:'#14121a',hanji:'#efe3c8',hanji2:'#d9c7a0',red:'#c8392b',teal:'#2f8f83',gold:'#f2c14e',orange:'#f08a24',fire:'#ffb347',fire2:'#ffe29a',white:'#fff6e0',blue:'#6fb6ff',ered:'#ff4f5e',green:'#8fe07a'};

// ================================================================
//  캔버스 · 화면 맞춤 (내부 해상도 240 × 400~520, 정수배 우선 확대)
// ================================================================
const W=240; let H=400, SCALE=2;
const cv=$('c'), ctx=cv.getContext('2d');
const stageEl=$('stage'), wrapEl=$('wrap');
let player=null;
function resize(){
  const cs=getComputedStyle(wrapEl);
  const aw=wrapEl.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const ah=wrapEl.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  H=Math.round(clamp(W*ah/aw,400,520));
  const fit=Math.min(aw/W,ah/H), dpr=window.devicePixelRatio||1, dev=fit*dpr, fl=Math.floor(dev);
  // 기기 픽셀 기준 정수배가 화면을 85% 이상 채우면 정수배, 아니면 꽉 채우기
  SCALE=(fl>=1&&fl/dev>=0.85)?fl/dpr:fit;
  cv.width=W; cv.height=H;
  stageEl.style.width=(W*SCALE)+'px'; stageEl.style.height=(H*SCALE)+'px';
  stageEl.style.setProperty('--u',SCALE+'px');
  ctx.imageSmoothingEnabled=false;
  if(player){player.x=clamp(player.x,6,W-6);player.y=clamp(player.y,22,H-12);}
}

// ================================================================
//  픽셀 그리기 도우미
// ================================================================
function pc(g,x,y,r,col){ g.fillStyle=col; x=Math.round(x); y=Math.round(y); r=Math.max(0,Math.round(r));
  for(let dy=-r;dy<=r;dy++){const dx=Math.floor(Math.sqrt(r*r-dy*dy)+0.35); g.fillRect(x-dx,y+dy,dx*2+1,1);} }
function pe(g,x,y,rx,ry,col){ g.fillStyle=col; x=Math.round(x); y=Math.round(y); ry=Math.max(1,Math.round(ry));
  for(let dy=-ry;dy<=ry;dy++){const dx=Math.floor(rx*Math.sqrt(Math.max(0,1-(dy*dy)/(ry*ry)))+0.35); g.fillRect(x-dx,y+dy,dx*2+1,1);} }
function fillRound(g,x,y,w,h,r,col){ g.fillStyle=col;
  for(let i=0;i<h;i++){ let ins=0; if(i<r) ins=r-Math.sqrt(Math.max(0,r*r-(r-i-0.5)**2)); else if(i>=h-r){const j=h-1-i; ins=r-Math.sqrt(Math.max(0,r*r-(r-j-0.5)**2));}
    ins=Math.round(ins); g.fillRect(x+ins,y+i,w-ins*2,1);} }
const add=()=>{ctx.globalCompositeOperation='lighter';}, norm=()=>{ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;};

function sprite(name,rows,pal){
  const h=rows.length, w=Math.max(...rows.map(r=>r.length));
  if(rows.some(r=>r.length!==w)) console.error('sprite width mismatch: '+name);
  const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d');
  for(let y=0;y<h;y++) for(let x=0;x<rows[y].length;x++){const ch=rows[y][x]; if(ch==='.') continue; g.fillStyle=pal[ch]||'#f0f'; g.fillRect(x,y,1,1);}
  const wc=document.createElement('canvas'); wc.width=w; wc.height=h; const wg=wc.getContext('2d');
  wg.drawImage(c,0,0); wg.globalCompositeOperation='source-in'; wg.fillStyle='#fff'; wg.fillRect(0,0,w,h);
  return {img:c,white:wc,w,h};
}
function dspr(s,x,y,flash,alpha){ if(alpha!==undefined) ctx.globalAlpha=alpha; ctx.drawImage(flash?s.white:s.img,Math.round(x-s.w/2),Math.round(y-s.h/2)); if(alpha!==undefined) ctx.globalAlpha=1; }

// 계단식(밴딩) 발광 스프라이트 — 픽셀 위에 얹는 최신 연출
const glowC=new Map();
function glowSpr(r,col){ const k=r+col; let c=glowC.get(k); if(c) return c;
  c=document.createElement('canvas'); c.width=c.height=r*2+1; const g=c.getContext('2d');
  for(let i=0;i<4;i++){ g.globalAlpha=0.22; pc(g,r,r,r*(1-i/4),col); }
  glowC.set(k,c); return c; }
function glow(x,y,r,col,a=1){ r=Math.max(1,Math.round(r)); if(a<=0) return; ctx.globalAlpha=Math.min(1,a); ctx.drawImage(glowSpr(r,col),Math.round(x-r),Math.round(y-r)); ctx.globalAlpha=1; }

// 적 탄 스프라이트 (먹 테두리 + 색 + 흰 심지)
const bulC=new Map();
function bulSpr(r,col){ const k=r+col; let c=bulC.get(k); if(c) return c;
  const s=(r+1)*2+1; c=document.createElement('canvas'); c.width=c.height=s; const g=c.getContext('2d'); const m=r+1;
  pc(g,m,m,r+1,C.ink); pc(g,m,m,r,col); pc(g,m,m,Math.max(0,r-2),'#fff6e0'); if(r<=2){g.fillStyle='#fff6e0';g.fillRect(m,m,1,1);}
  bulC.set(k,c); return c; }

// 3×5 픽셀 폰트 (숫자·영문)
const FONT={'0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001','5':'111100111001111','6':'111100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001111',
A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111',
':':'000010000010000','-':'000000111000000','!':'010010010000010','.':'000000000000010','/':'001001010100100','+':'000010111010000',' ':'000000000000000'};
function drawStr(s,x,y,col,sc){ ctx.fillStyle=col; for(let i=0;i<s.length;i++){ const g=FONT[s[i]]; if(!g) continue;
  for(let j=0;j<15;j++) if(g.charCodeAt(j)===49) ctx.fillRect(x+i*4*sc+(j%3)*sc,y+((j/3)|0)*sc,sc,sc); } }
function ptext(s,x,y,col,sc=1,align='left',shadow=false){ s=String(s).toUpperCase(); const w=s.length*4*sc-sc;
  if(align==='center') x-=(w/2)|0; else if(align==='right') x-=w; x=Math.round(x); y=Math.round(y);

//  절차 생성 + parallax 3겹(땅 · 나무 · 안개)
// ================================================================
const CH=256;
const pathX=wy=>120+Math.sin(wy/310)*46+Math.sin(wy/97+1.3)*14;
const chunkCache=new Map();
// 스테이지가 바뀌면 화면 밖 위쪽 청크부터 새 장소로 바뀐다
let biomeMarks=[{k:0,b:1}], treeMarks=[{b:-1e9,biome:1}];
function biomeOf(k){ let b=1, first=false; for(const m of biomeMarks) if(k>=m.k){ b=m.b; first=k===m.k&&m.k>0; } return {b,first}; }
function getChunk(k){ const {b,first}=biomeOf(k), key=b+':'+k; let c=chunkCache.get(key);
  if(!c){ c=(b===2?genBamboo:b===3?genPond:genVillage)(k,first); c.b=b; chunkCache.set(key,c); if(chunkCache.size>8) chunkCache.delete(chunkCache.keys().next().value); }
  return c; }
function newCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function dith(g,x,y,r,col,ph=0){ g.fillStyle=col; x=Math.round(x); y=Math.round(y); r=Math.round(r);
  for(let dy=-r;dy<=r;dy++){ const dx=Math.floor(Math.sqrt(r*r-dy*dy)); for(let xx=x-dx;xx<=x+dx;xx++) if(((xx+y+dy+ph)&1)===0) g.fillRect(xx,y+dy,1,1); } }
function shadowE(g,x,y,rx,ry,a=.28){ g.globalAlpha=a; pe(g,x,y,rx,ry,C.ink); g.globalAlpha=1; }
function makeFree(occ,wyOf,half){ return (x,y,w,h)=>{ if(x<2||y<3||x+w>W-2||y+h>CH-3) return false;
  for(const o of occ) if(x<o.x+o.w&&x+w>o.x&&y<o.y+o.h&&y+h>o.y) return false;
  for(let ly=y;ly<=y+h;ly+=3){ const px=pathX(wyOf(ly)); if(x<px+half&&x+w>px-half) return false; } return true; }; }
function tufts(g,R,n,cols){ for(let i=0;i<n;i++){ const x=R()*W|0, y=R()*CH|0; g.fillStyle=pickR(R,cols); g.fillRect(x,y,1,1); g.fillRect(x+2,y,1,1); g.fillRect(x+1,y+1,1,1); } }
function flowerDots(g,R,n,petals){ for(let i=0;i<n;i++){ const cx=R()*W|0, cy=R()*CH|0, col=pickR(R,petals);
  for(let j=0;j<3;j++){ const x=cx+(R()*8|0)-4, y=cy+(R()*6|0)-3; g.fillStyle=col; g.fillRect(x-1,y,3,1); g.fillRect(x,y-1,1,3); g.fillStyle='#ffd35a'; g.fillRect(x,y,1,1); } } }
function stoneWall(g,x,y,w,h,R,gap){
  const st=(sx,sy)=>{ g.fillStyle='#5f5c56'; g.fillRect(sx,sy,3,2); g.fillStyle=pickR(R,['#a9a59c','#8f8b82','#b8b4aa']); g.fillRect(sx,sy,2,1); };
  for(let i=0;i<w-1;i+=3){ st(x+i,y); st(x+i,y+h-2); }
  for(let i=2;i<h-2;i+=2){ if(!(gap&&gap.side==='l'&&i>=gap.y0&&i<gap.y1)) st(x,y+i); if(!(gap&&gap.side==='r'&&i>=gap.y0&&i<gap.y1)) st(x+w-3,y+i); } }
function stream(g,k,sy,R,h,col,hi){ for(let x=0;x<W;x++){ const t=sy+Math.round(Math.sin(x/17+k)*2), b=sy+h+Math.round(Math.sin(x/13+k*2)*2);
    g.fillStyle='#7a6a4a'; g.fillRect(x,t-2,1,2); g.fillRect(x,b,1,2); g.fillStyle=col; g.fillRect(x,t,1,b-t); }
  for(let i=0;i<30;i++){ g.fillStyle=R()<.6?hi:'#5a98b8'; g.fillRect(R()*W|0,sy+3+(R()*(h-5)|0),2+(R()*3|0),1); }
  for(let i=0;i<12;i++){ const x=R()*W|0, y=R()<.5?sy-1:sy+h+1; pe(g,x,y,2,1,'#9a968c'); g.fillStyle='#c8c4b8'; g.fillRect(x-1,y-1,1,1); }
  for(let i=0;i<16;i++){ const x=R()*W|0, y=R()<.5?sy-3:sy+h+2; g.fillStyle='#8aa050'; g.fillRect(x,y-3,1,4); g.fillRect(x+2,y-2,1,3); } }
function bridge(g,px,sy,h){ const x=Math.round(px)-9; g.fillStyle='rgba(20,18,26,.35)'; g.fillRect(x+2,sy-2,18,h+6);
  for(let yy=sy-3;yy<sy+h+3;yy++){ g.fillStyle=(yy%3===0)?'#6a4a30':'#b08a5e'; g.fillRect(x,yy,18,1); }
  g.fillStyle='#5a3a24'; g.fillRect(x-1,sy-4,1,h+8); g.fillRect(x+18,sy-4,1,h+8); }
function stoneLantern(g,x,y,lights){ shadowE(g,x+2,y+3,3,2,.3); g.fillStyle='#6f6b62'; g.fillRect(x-2,y+1,5,3); g.fillStyle='#a9a59c'; g.fillRect(x-1,y-2,3,3);
  g.fillStyle='#6a665c'; g.fillRect(x-2,y-5,5,3); g.fillStyle='#ffcf6a'; g.fillRect(x,y-4,1,1); pe(g,x,y-6,3,1,'#b8b4aa'); lights.push({x,y:y-4}); }
function mossRock(g,x,y){ shadowE(g,x+1,y+2,5,3); pe(g,x,y,5,3,'#6f6b62'); pe(g,x-1,y-1,4,2,'#9a968c'); dith(g,x-1,y-2,2,'#6f9a4a'); }
function mushroom(g,x,y){ g.fillStyle='#f4ecd8'; g.fillRect(x,y+1,1,2); g.fillStyle='#d8453a'; g.fillRect(x-1,y-1,3,2); g.fillStyle='#ffffff'; g.fillRect(x,y-1,1,1); }
function cairn(g,x,y){ shadowE(g,x+2,y+4,5,2); pe(g,x,y+3,5,2,'#7f7b72'); pe(g,x,y+2,5,2,'#9a968c'); pe(g,x,y-1,4,2,'#8f8b82'); pe(g,x,y-2,4,1,'#a9a59c'); pe(g,x,y-4,3,1,'#b8b4aa'); pe(g,x,y-6,2,1,'#c8c4b8'); }

function drawThatch(g,x,y,w,h,R){ const rh=h-6;
  fillRound(g,x+3,y+4,w,rh+2,8,'rgba(20,18,26,.3)');
  g.fillStyle='#8a6a4a'; g.fillRect(x+2,y+h-8,w-4,8); g.fillStyle='#f3e9d2'; g.fillRect(x+3,y+h-7,w-6,5);
  g.fillStyle='#8a6242'; for(let i=x+3;i<x+w-3;i+=7) g.fillRect(i,y+h-7,1,5);
  g.fillStyle='#6a4630'; g.fillRect(x+(w>>1)-2,y+h-6,4,4); g.fillStyle='#fff8e8'; g.fillRect(x+5,y+h-6,3,2); g.fillRect(x+w-8,y+h-6,3,2);
  g.fillStyle='#b98a58'; g.fillRect(x+3,y+h-2,w-6,2); g.fillStyle='#9a968c'; g.fillRect(x+2,y+h,w-4,1);
  fillRound(g,x,y,w,rh,8,'#7a5a2c'); fillRound(g,x+1,y+1,w-2,rh-2,7,'#b88e48'); fillRound(g,x+1,y+1,w-4,rh-4,7,'#d4ae62'); fillRound(g,x+2,y+2,w-10,rh-9,5,'#e8ca80');
  for(let i=0;i<50;i++){ g.fillStyle=R()<.5?'#c49a50':'#f2da98'; g.fillRect(x+3+(R()*(w-7)|0),y+2+(R()*(rh-5)|0),2,1); }
  g.fillStyle='rgba(122,90,44,.5)'; for(let i=5;i<w-4;i+=5) for(let j=2;j<rh-2;j+=2) g.fillRect(x+i,y+j,1,1);
  const ry=y+(rh>>1)-1; g.fillStyle='#a07c3c'; g.fillRect(x+5,ry,w-10,2); g.fillStyle='#f4dc9a'; g.fillRect(x+5,ry,w-10,1); }
function drawTileHouse(g,x,y,w,h){ const rh=h-7;
  g.fillStyle='rgba(20,18,26,.32)'; g.fillRect(x+3,y+4,w,h-2);
  g.fillStyle='#6b4a33'; g.fillRect(x+2,y+h-9,w-4,9); g.fillStyle='#f6eedc'; g.fillRect(x+3,y+h-8,w-6,5);

  g.fillStyle='#c8a878'; g.fillRect(x+7,y+h-7,1,3); g.fillRect(x+w-7,y+h-7,1,3); g.fillRect(x+5,y+h-6,4,1); g.fillRect(x+w-9,y+h-6,4,1);
  g.fillStyle='#6a4630'; g.fillRect(x+(w>>1)-2,y+h-7,5,4);
  g.fillStyle='#c49a64'; g.fillRect(x+3,y+h-3,w-6,2); g.fillStyle='#9a968c'; g.fillRect(x+2,y+h-1,w-4,1);
  g.fillStyle='#1e2330'; g.fillRect(x,y,w,rh); g.fillStyle='#46506a'; g.fillRect(x+1,y+1,w-2,rh-2);
  for(let yy=y+2;yy<y+rh-1;yy+=3){ g.fillStyle='#5e6a86'; g.fillRect(x+1,yy,w-2,1); g.fillStyle='#343c52'; g.fillRect(x+1,yy+1,w-2,1); }
  g.fillStyle='#2c3346'; for(let xx=x+3;xx<x+w-2;xx+=4) for(let yy=y+2;yy<y+rh-1;yy+=3) g.fillRect(xx,yy,1,2);
  const ry=y+(rh>>1)-1; g.fillStyle='#1a1e28'; g.fillRect(x+2,ry,w-4,3); g.fillStyle='#3a4256'; g.fillRect(x+2,ry,w-4,1);
  g.fillStyle='#e8e2d4'; g.fillRect(x+1,ry-1,2,4); g.fillRect(x+w-3,ry-1,2,4);

function drawCompound(g,x,y,ww,wh,hw,hh,tile,gateRight,R,lights){
  g.fillStyle='#d8c094'; g.fillRect(x+2,y+2,ww-4,wh-4);
  for(let i=0;i<5;i++) dith(g,x+6+R()*(ww-12),y+6+R()*(wh-12),3+R()*4,'#c8ae80',i&1);
  const gy=(wh>>1)-4; stoneWall(g,x,y,ww,wh,R,{side:gateRight?'r':'l',y0:gy,y1:gy+8});
  const gx=gateRight?x+ww-3:x; g.fillStyle='#6b4a33'; g.fillRect(gx,y+gy-1,3,2); g.fillRect(gx,y+gy+8,3,2);
  // 장독대
  const jx=gateRight?x+5:x+ww-17, jy=y+wh-8; g.fillStyle='#8f8b82'; g.fillRect(jx-1,jy-3,14,6); g.fillStyle='#b8b4aa'; g.fillRect(jx-1,jy-3,14,1);
  for(let i=0;i<4;i++){ const cx=jx+1+i*3, cy=jy-(i%2); pc(g,cx+1,cy+1,1,'#2a140e'); pc(g,cx,cy,1,'#5a2a1c'); g.fillStyle='#b8704a'; g.fillRect(cx-1,cy-1,1,1); }
  // 마당의 닭
  const nCh=R()<.6?(R()<.5?1:2):0;
  for(let i=0;i<nCh;i++){ const cx=x+8+(R()*(ww-20)|0), cy=y+wh-6-(R()*3|0); g.fillStyle='rgba(20,18,26,.3)'; g.fillRect(cx,cy+2,3,1); g.fillStyle='#ffffff'; g.fillRect(cx,cy,3,2); g.fillStyle='#e0483a'; g.fillRect(cx+2,cy-1,1,1); g.fillStyle='#f2c14e'; g.fillRect(cx+3,cy,1,1); }
  const hx=x+6, hy=y+5; if(tile) drawTileHouse(g,hx,hy,hw,hh); else drawThatch(g,hx,hy,hw,hh,R);
  lights.push({x:hx+6,y:hy+hh-5},{x:hx+hw-7,y:hy+hh-5}); }
function paddy(g,x,y,w,h,R){ const gold=R()<.6; g.fillStyle='#8aa85a'; g.fillRect(x-2,y-2,w+4,h+4); g.fillStyle='#a8845a'; g.fillRect(x-1,y-1,w+2,h+2);

  if(type==='reeds'){ for(let i=0;i<18;i++){ const x=m-8+R()*16|0, y=m+R()*10|0, h=5+(R()*8|0); g.fillStyle=pickR(R,['#7a9a44','#9ab85a','#5f7f3a']); g.fillRect(x,y-h,1,h); if(R()<.4){ g.fillStyle='#7a4a2a'; g.fillRect(x,y-h-2,1,3); } } return c; }
  shadowE(g,m+5,m+6,m-6,m-10);
  if(type==='bamboo'){
    for(let i=0;i<40;i++){ const a=R()*TAU, L=6+R()*10, cx=m+(R()*8-4), cy=m+(R()*8-4), col=pickR(R,['#2f5a2a','#3f7a3a','#5a9a44','#7ab85a','#9ad06a']);
      for(let s=0;s<L;s++){ const x=cx+Math.cos(a)*s, y=cy+Math.sin(a)*s; g.fillStyle=col; g.fillRect(x|0,y|0,1,1); if(s>1&&s<L*.6) g.fillRect((x+Math.sin(a))|0,(y-Math.cos(a))|0,1,1); } }
    for(let i=0;i<5;i++){ const cx=m-5+R()*10, cy=m-5+R()*10; pc(g,cx,cy,1.6,'#2a4424'); pc(g,cx,cy,1,'#a8c878'); }
    return c; }
  if(type==='willow'){ pc(g,m,m,14,'#2f5a2a'); dith(g,m,m,14,'#3f7a3a');
    for(let i=0;i<110;i++){ const a=R()*TAU, d=R()*13, x=m+Math.cos(a)*d, y=m+Math.sin(a)*d-3, L=3+(R()*8|0); g.fillStyle=pickR(R,['#6a9a4a','#8ab85a','#4a7a3a','#a8d070']); g.fillRect(x|0,y|0,1,L); }
    return c; }
  if(type==='pine'){ for(let i=0;i<8;i++){ const a=i/8*TAU+R()*.3, d=6+R()*3; pc(g,m+Math.cos(a)*d,m+Math.sin(a)*d,5,'#1a3226'); } pc(g,m,m,7,'#1a3226');
    for(let i=0;i<8;i++){ const a=i/8*TAU+.2, d=5+R()*2; pc(g,m+Math.cos(a)*d-1,m+Math.sin(a)*d-1,4,'#2a5040'); dith(g,m+Math.cos(a)*d-2,m+Math.sin(a)*d-2,3,'#3e6e56',i&1); }
    pc(g,m-1,m-1,4,'#3e6e56'); dith(g,m-2,m-3,3,'#5a8a6a'); g.fillStyle='#8a4a3a'; g.fillRect(m,m,2,2); return c; }
  pc(g,m,m,13,'#1f3a1c'); pc(g,m,m,12,'#2f5a28'); dith(g,m,m,12,'#3a6e30'); pc(g,m-2,m-2,9,'#3f7a34'); dith(g,m-2,m-2,9,'#4f8e3e',1); pc(g,m-4,m-4,5,'#5a9a44'); dith(g,m-4,m-4,5,'#7ab85a');
  for(let i=0;i<40;i++){ const a=R()*TAU, d=R()*11; g.fillStyle=R()<.5?'#26481f':'#6aaa4a'; g.fillRect((m+Math.cos(a)*d)|0,(m+Math.sin(a)*d)|0,1,1); }
  if(type==='persimmon') for(let i=0;i<13;i++){ const a=R()*TAU, d=3+R()*9, x=(m+Math.cos(a)*d)|0, y=(m+Math.sin(a)*d)|0; g.fillStyle='#b8501a'; g.fillRect(x,y+1,2,1); g.fillStyle='#f08a24'; g.fillRect(x,y,2,1); g.fillStyle='#ffc27a'; g.fillRect(x,y,1,1); }
  return c; }

function drawWorld(){
  const ig=worldInGame(), st=ig?G.stage:1, p=ig?clamp(G.stageT/170,0,1):1, s=G.scroll;
  const k0=Math.floor(s/CH), k1=Math.floor((s+H)/CH), vis=[];
  for(let k=k0;k<=k1;k++){ const c=getChunk(k), y=Math.round(H-((k+1)*CH-s)); ctx.drawImage(c.canvas,0,y); vis.push([c,y]); }
  const s2=s*1.35;
  for(let b=Math.floor(s2/TB)-1;b<=Math.floor((s2+H)/TB)+1;b++){ const bio=treeBiome(b), R=mulberry32(b*31+5+bio*101), edge=bio===2?42:30;
    const n=bio===2?(R()<.85?2:1):(R()<.55?1:(R()<.5?2:0));
    for(let i=0;i<n;i++){ const mid=R()<(bio===2?.04:.1), x=mid?R()*W:(R()<.5?R()*edge:W-edge+R()*edge), oy=R()*TB, t=treeSpr[pickR(R,TREESET[bio])];
      ctx.drawImage(t,Math.round(x-t.width/2),Math.round(H-(b*TB+oy-s2)-t.height/2)); } }
  const [a,bb]=TINT[st]; ctx.globalCompositeOperation='multiply';
  ctx.fillStyle=`rgb(${lerp(a[0],bb[0],p)|0},${lerp(a[1],bb[1],p)|0},${lerp(a[2],bb[2],p)|0})`; ctx.fillRect(0,0,W,H); ctx.globalCompositeOperation='source-over';
  const li=st===1?clamp((p-.45)/.35,0,1)*.9:st===2?.6:1;
  add();
  if(li>0) for(const [c,y] of vis) for(const L of c.lights){ const fl=.75+.25*Math.sin(G.t*3+L.x); glow(L.x,y+L.y,6,'#ffb347',li*.55*fl); ctx.fillStyle='#ffe29a'; ctx.globalAlpha=li; ctx.fillRect(L.x-1,y+L.y,2,2); ctx.globalAlpha=1; }
  for(const [c,y] of vis) if(c.spark) for(let i=0;i<c.spark.length;i++){ if(Math.sin(G.t*2.4+i*1.7)>.75){ const q=c.spark[i]; ctx.fillStyle='#dff2ff'; ctx.globalAlpha=.8; ctx.fillRect(q.x,y+q.y,2,1); ctx.globalAlpha=1; } }
  const fa=st>=2?1:clamp((p-.7)/.3,0,1);
  if(fa>0) for(let i=0;i<14;i++){ const x=((i*53+Math.sin(G.t*.7+i)*20)%W+W)%W, y=((i*97+G.t*6*(i%3+1))%H); if(Math.sin(G.t*3+i*1.7)>.2){ glow(x,y,3,'#d9f27a',.5*fa); ctx.fillStyle='#eaffb0'; ctx.globalAlpha=fa; ctx.fillRect(x|0,y|0,1,1); ctx.globalAlpha=1; } }
  norm();
  const ma=st===2?.2:.08, s3=s*1.9; ctx.globalAlpha=ma;
  for(let i=0;i<5;i++){ const x=((i*97)%W)-30, y=((i*170+s3)%(H+120))-60; ctx.drawImage(mistSpr,x,Math.round(y)); }
  ctx.globalAlpha=1; }

const AU={ctx:null,master:null,sfxG:null,musG:null,muted:!!store.get('mute',false),last:{},noiseBuf:null,
  init(){ if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume(); return; }
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    try{ this.ctx=new AC(); }catch(e){ return; }
    this.master=this.ctx.createGain(); this.master.gain.value=this.muted?0:.9; this.master.connect(this.ctx.destination);
    this.sfxG=this.ctx.createGain(); this.sfxG.gain.value=.8; this.sfxG.connect(this.master);
    this.musG=this.ctx.createGain(); this.musG.gain.value=.32; this.musG.connect(this.master);
    const len=this.ctx.sampleRate; this.noiseBuf=this.ctx.createBuffer(1,len,len); const d=this.noiseBuf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; },
  setMute(m){ this.muted=m; store.set('mute',m); if(this.master) this.master.gain.value=m?0:.9; },
  ok(name,gap){ if(!this.ctx||this.muted) return false; const n=this.ctx.currentTime; if(gap&&this.last[name]&&n-this.last[name]<gap) return false; this.last[name]=n; return true; },
  tone(f,dur,type='square',vol=.1,f2=null,delay=0,dest){ const c=this.ctx, t=c.currentTime+delay; const o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g); g.connect(dest||this.sfxG); o.start(t); o.stop(t+dur+.02); },
  noise(dur,vol=.1,freq=2000,type='lowpass',delay=0,dest){ const c=this.ctx, t=c.currentTime+delay; const s=c.createBufferSource(); s.buffer=this.noiseBuf;
    const f=c.createBiquadFilter(); f.type=type; f.frequency.value=freq; const g=c.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(dest||this.sfxG); s.start(t,Math.random()*.5); s.stop(t+dur+.02); }
};

class Pool{ constructor(n,make){ this.free=[]; this.list=[]; this.make=make; for(let i=0;i<n;i++) this.free.push(make()); }
  get(){ const o=this.free.pop()||this.make(); this.list.push(o); return o; }
  sweep(){ const L=this.list; let j=0; for(let i=0;i<L.length;i++){ const o=L[i]; if(o.dead) this.free.push(o); else L[j++]=o; } L.length=j; }
  clear(){ for(const o of this.list) this.free.push(o); this.list.length=0; } }

function part(kind,x,y,vx,vy,life,col,size,size2){ if(PT.list.length>1400) return; const p=PT.get(); p.kind=kind;p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.life=p.max=life;p.col=col;p.size=size||1;p.size2=size2||0;p.dead=false;p.drag=kind==='spark'?.92:1; }
function fan(x,y,n,spread,spd,kind,col){ const a0=Math.atan2(player.y-y,player.x-x); for(let i=0;i<n;i++){ const a=a0+(n===1?0:-spread/2+spread*i/(n-1)); spawnEB(x,y,Math.cos(a)*spd,Math.sin(a)*spd,kind,col); } }
function ring(x,y,n,spd,off,kind,col,w){ for(let i=0;i<n;i++){ const a=off+TAU*i/n; const b=spawnEB(x,y,Math.cos(a)*spd,Math.sin(a)*spd,kind,col); if(b&&w) b.w=w; } }
function fanW(x,y,n,spread,spd,kind,col,w,acc){ const a0=Math.atan2(player.y-y,player.x-x); for(let i=0;i<n;i++){ const a=a0+(n===1?0:-spread/2+spread*i/(n-1)); const b=spawnEB(x,y,Math.cos(a)*spd,Math.sin(a)*spd,kind,col); if(b){ b.w=w?(i<n/2?-w:w):0; b.acc=acc||0; } } }
function explode(x,y,s){ const n=6+s*8; for(let i=0;i<n;i++){ const a=Math.random()*TAU, sp=rand(20,70+s*40); part('spark',x,y,Math.cos(a)*sp,Math.sin(a)*sp,rand(.25,.6),pick([C.fire,C.fire2,C.white,'#ff6a3a']),s>=2?2:1); }
  part('glow',x,y,0,0,.25+.08*s,C.fire,6+s*5); if(s>=2) part('ring',x,y,0,0,.35,C.fire2,4,14+s*10);
  for(let i=0;i<s*2;i++) part('smoke',x+rand(-4,4),y+rand(-4,4),rand(-10,10),rand(-20,-5),rand(.5,.9),'#2a2433',3+s); }
function cancelBullets(x,y,r,score){ let n=0; for(const b of EB.list){ if(b.dead) continue; if((b.x-x)**2+(b.y-y)**2<r*r){ b.dead=true; n++; part('cancel',b.x,b.y,rand(-10,10),rand(-40,-20),.5,C.gold,1); if(score) addScore(10); } } if(n) SFX.cancel(); }

function spawnItem(type,x,y){ items.push({type,x:x??rand(40,W-40),y:y??-10,vx:(Math.random()<.5?-1:1)*22,t:0,dead:false}); }

function spawnEnemy(type,x,y,o={}){ const d=EDEF[type]; const e={type,x,y,t:0,flash:0,dead:false,gone:false,r:d.r,armor:d.armor||1,score:d.score,gauge:d.gauge,invul:false};
  e.hp=e.maxHp=d.hp*(1+.7*(G.stage-1))*DF.hp; d.init&&d.init(e,o); enemies.push(e); return e; }
const valid=e=>!e.dead&&!e.gone&&!(e.invul&&!e.parent)&&e.y>-30;

function damageEnemy(e,dmg,src){
  if(e.dead||e.gone) return;
  const beamish=src==='beam'||src==='storm';
  if(e.parent){ if(e.flash<=-.12) e.flash=.03; e=e.parent; if(!beamish) dmg*=.5; }
  if(e.invul||e.dead) return;
  if(beamish){ if(e._bf===G.frame) return; e._bf=G.frame; } else dmg*=e.armor||1;
  // 연속 피격에도 원래 모습이 보이도록 번쩍임은 깜빡이는 간격을 둔다
  e.hp-=dmg; if(e.flash<=-.12) e.flash=.03;
  if(src==='shot') player.gauge=Math.min(100,player.gauge+dmg*(e.boss?.05:.02));
  SFX.hit();
  if(e.hp<=0) killEnemy(e);
}
function killEnemy(e){ if(e.dead) return; e.dead=true; if(e.boss){ if(e.mid) midDefeated(e); else bossDefeated(e); return; }
  // 어려움: 쓰러지며 느린 반격탄 (여우 바로 앞에서는 쏘지 않음)
  if(DF.hard&&e.y<player.y-60) ring(e.x,e.y,e.type==='wisp'?3:5,42*M(),Math.random()*TAU,'small','#b8a0e8');
  G.combo++; G.comboT=1.8; G.maxCombo=Math.max(G.maxCombo,G.combo);
  addScore(Math.round(e.score*comboMult())); player.gauge=Math.min(100,player.gauge+e.gauge);
  const s=e.type==='bulga'?3:(e.type==='egg'||e.type==='dark')?2:1; explode(e.x,e.y,s); SFX.kill();
  if(s>=2){ G.shake=Math.max(G.shake,1+s); if(s>=3){ G.hitStop=.06; vib(30);} }
  if(e.type==='bulga'||Math.random()<.03) spawnItem('heal',e.x,e.y); }

function every(b,interval,count,fn){ while(b.pk<count&&b.pt>=b.pk*interval){ fn(b.pk); b.pk++; } return b.pk>=count&&b.pt>=count*interval; }

function updHands(b,dt){ for(const h of b.hands){ const rx=b.x+h.sx, ry=b.y+34;
  if(h.st==='rest'){ h.x=lerp(h.x,rx,Math.min(1,dt*5)); h.y=lerp(h.y,ry+Math.sin(b.t*2+h.sx)*3,Math.min(1,dt*5)); }
  else if(h.st==='raise'){ h.w-=dt; h.x=lerp(h.x,h.tx,Math.min(1,dt*6)); h.y=lerp(h.y,40,Math.min(1,dt*6)); if(h.w<=0){ h.st='drop'; h.vy=80; h.x=h.tx; } }
  else if(h.st==='drop'){ h.vy+=1400*dt; h.y+=h.vy*dt; if(h.y>=H-24){ h.y=H-24; h.st='impact'; h.w=.35; ring(h.x,h.y,b.phase2?16:12,70*M(),Math.random(),'small',C.ered); G.shake=Math.max(G.shake,6); SFX.boom(); vib(40); explode(h.x,h.y+6,2); } }
  else if(h.st==='impact'){ h.w-=dt; if(h.w<=0) h.st='back'; }
  else if(h.st==='back'){ h.x=lerp(h.x,rx,Math.min(1,dt*4)); h.y=lerp(h.y,ry,Math.min(1,dt*4)); if(Math.abs(h.y-ry)<2) h.st='rest'; }
  if((h.st==='drop'||h.st==='impact')&&player.alive&&Math.abs(player.x-h.x)<12&&Math.abs(player.y-h.y)<12) hurt(20); } }

const ITEM_PLAN={1:[[26,'evo'],[48,'orb'],[72,'evo'],[100,'orb'],[124,'evo'],[140,'heal']],
  2:[[20,'evo'],[44,'orb'],[62,'heal'],[70,'evo'],[96,'orb'],[120,'evo'],[145,'heal']],
  3:[[18,'evo'],[40,'orb'],[55,'heal'],[62,'evo'],[92,'orb'],[115,'heal'],[150,'heal']]};
function buildStage(n){ const R=mulberry32(1000+n), ev=[], addE=(t,f)=>ev.push({t,f});
  let t=4; while(t<165){ const pool=POOLS[n].concat(n===1&&t>90?['egg']:[]); const w=pickR(R,pool); addE(t,()=>WAVES[w]()); t+=[0,4.6,4,3.6][n]+R()*1.6; }
  for(const [tt,type] of ITEM_PLAN[n]) addE(tt,()=>spawnItem(type));
  // 보통·어려움: 84초에 중간 보스 (살아 있는 동안 스테이지 시간이 멈춘다)
  if(DF.midboss) addE(84,()=>spawnMid(n));
  addE(168,()=>startWarning(n));
  return ev.sort((a,b)=>a.t-b.t); }
function startWarning(n){ G.warnT=2.8; SFX.warn(); MUS.stop(); later(2.8,()=>spawnBoss(n)); }
function startStage(n,extra){ G.stage=n; G.stageT=0; G.events=buildStage(n); G.evIdx=0; G.later=[]; G.boss=null; G.mid=null; G.clearT=0;
  // 새 장소는 화면 위쪽 밖에서부터 이어진다 (땅 청크 · 나무 층 따로)
  if(n>1){ biomeMarks.push({k:Math.floor((G.scroll+H)/CH)+1,b:n}); treeMarks.push({b:Math.floor((G.scroll*1.35+H)/TB)+2,biome:n}); }
  toast(n+'장 · '+STAGE_NAME[n],extra||'',null,1); MUS.play('stage'); }
function nextStage(){ if(G.stage<3){ player.hp=Math.min(player.maxHp,player.hp+30); startStage(G.stage+1,'체력 +30'); } else gameClear(); }
function gameClear(){ G.state='clear'; const bonus=Math.ceil(player.hp)*100; addScore(bonus); G.resultT=3; SFX.clear(); vib([40,40,40,40,200]);
  toast('클리어!','남은 체력 보너스 '+pts(bonus),'big',3); }

// ================================================================
function orbPos(i){ const n=player.orbs, a=player.orbAng+i*TAU/n, R=9+n*.8; return {x:player.x+Math.cos(a)*R,y:player.y+Math.sin(a)*R*.55,back:Math.sin(a)<0}; }
function fireVolley(){ const n=player.orbs, angs=FAN[n-1], sp=player.tails>=9?380:340;
  for(let i=0;i<angs.length;i++){ const o=orbPos(i%n), a=angs[i]*Math.PI/180; const b=spawnPB(o.x,o.y-2,Math.sin(a)*sp,-Math.cos(a)*sp,dmgMult(),'fire'); b.homing=player.tails>=2&&Math.abs(angs[i])<40; }
  if(player.tails>=5) for(const q of player.ph){ const b=spawnPB(q.x,q.y-4,0,-sp,.8*dmgMult(),'phantom'); b.homing=true; }
  SFX.shot(); }
function updatePlayer(dt){ const p=player; if(!p.alive) return;
  let mx=0,my=0; if(keys.ArrowLeft||keys.KeyA) mx--; if(keys.ArrowRight||keys.KeyD) mx++; if(keys.ArrowUp||keys.KeyW) my--; if(keys.ArrowDown||keys.KeyS) my++;
  if(mx||my){ const sp=(keys.ShiftLeft||keys.ShiftRight)?55:115, l=Math.hypot(mx,my); p.x+=mx/l*sp*dt; p.y+=my/l*sp*dt; }
  p.x=clamp(p.x,6,W-6); p.y=clamp(p.y,22,H-12);
  p.orbAng+=dt*2.4; p.inv=Math.max(0,p.inv-dt); p.awakenT=Math.max(0,p.awakenT-dt);
  p.gauge=Math.min(100,p.gauge+dt*1.2);
  p.fireT-=dt; if(p.fireT<=0){ p.fireT=Math.max(0,p.fireT+(p.tails>=9?.085:.11)); fireVolley(); }
  const offs=[[-22,8],[22,8]]; p.ph.forEach((q,i)=>{ q.x=lerp(q.x,p.x+offs[i][0],Math.min(1,dt*8)); q.y=lerp(q.y,p.y+offs[i][1],Math.min(1,dt*8)); });
  if(p.gauge>=100&&!G.readyShown){ G.readyShown=true; SFX.ready(); } }
function threatNear(r){ for(const b of EB.list) if(!b.dead&&(b.x-player.x)**2+(b.y-player.y)**2<r*r) return true;
  for(const e of enemies) if(valid(e)&&dist2(e,player)<(r+e.r)**2) return true; return false; }
function doSwipe(){ SFX.swipe(); G.swipe=.4; part('ring',player.x,player.y,0,0,.3,C.fire2,6,52);
  for(const e of enemies) if(valid(e)&&dist2(e,player)<(48+e.r)**2) damageEnemy(e,14*dmgMult(),'swipe');
  for(const b of EB.list){ if(b.dead) continue; const dx=b.x-player.x, dy=b.y-player.y, d=Math.hypot(dx,dy); if(d<50){ b.dead=true; spawnPB(b.x,b.y,dx/(d||1)*260,dy/(d||1)*260-60,2*dmgMult(),'reflect'); } } }
function updateSkills(dt){ if(!player.alive) return;
  if(player.tails>=6){ G.rainT+=dt; if(G.rainT>=7){ G.rainT=0; G.rain=1.3; SFX.swipe(); } }
  if(G.rain>0){ G.rain-=dt; G.rainAcc+=dt*28; while(G.rainAcc>=1){ G.rainAcc--; const b=spawnPB(rand(4,W-4),-6,rand(-25,-10),rand(260,320),4*dmgMult(),'rain'); b.life=3; } }
  if(player.tails>=8){ G.swipeT+=dt; if(G.swipeT>=2.6&&threatNear(52)){ G.swipeT=0; doSwipe(); } }
  if(G.swipe>0) G.swipe=Math.max(0,G.swipe-dt); }
function tryBeam(){ if(G.state!=='play'||!player.alive||G.beam||player.gauge<100) return;
  player.gauge=0; G.readyShown=false; const lv=player.tails>=9?3:player.tails>=7?2:player.tails>=4?1:0;
  G.beam={t:0,dur:lv===3?3.5:2.5,lv,top:-10,angs:[0]}; SFX.beam(lv); SFX.beamOn(); G.shake=Math.max(G.shake,3); vib(40);
  if(lv===3){ G.flash=.5; G.flashCol='#ffe29a'; toast('여우불 폭풍','',null,1); } }
function updateBeam(dt){ const B=G.beam; if(!B) return; B.t+=dt;
  if(B.t>=B.dur||!player.alive){ G.beam=null; SFX.beamOff(); return; }
  const px=player.x, py=player.y-8;
  if(B.lv===0){ let best=null, by=-1e9; for(const e of enemies){ if(!valid(e)) continue; if(e.y<py&&Math.abs(e.x-px)<e.r+4&&e.y>by){ best=e; by=e.y; } }
    B.top=best?best.y:-10; if(best){ damageEnemy(best,60*dt,'beam'); if(Math.random()<.5) part('spark',best.x+rand(-4,4),best.y+4,rand(-60,60),rand(10,60),.3,C.fire2,1); } }
  else if(B.lv===1){ for(const e of enemies) if(valid(e)&&e.y<py+e.r&&Math.abs(e.x-px)<e.r+9){ damageEnemy(e,85*dt,'beam'); if(Math.random()<.3) part('spark',e.x,e.y,rand(-60,60),rand(-20,60),.3,C.fire2,1); } }
  else if(B.lv===2){ const sw=.2+Math.sin(B.t*3)*.12; B.angs=[0,sw,-sw];
    for(const a of B.angs){ const dx=Math.sin(a), dy=-Math.cos(a);
      for(const e of enemies){ if(!valid(e)) continue; const ex=e.x-px, ey=e.y-py; if(ex*dx+ey*dy<-e.r) continue; if(Math.abs(ex*dy-ey*dx)<e.r+8) damageEnemy(e,95*dt,'beam'); }
      for(const b of EB.list){ if(b.dead) continue; const ex=b.x-px, ey=b.y-py; if(ex*dx+ey*dy>0&&Math.abs(ex*dy-ey*dx)<9){ b.dead=true; part('cancel',b.x,b.y,rand(-10,10),-30,.5,C.gold,1); addScore(10); } } } }
  else { for(const e of enemies) if(valid(e)&&!e.parent&&e.y>-20) damageEnemy(e,(Math.abs(e.x-px)<32?300:130)*dt,'storm');
    for(const b of EB.list) if(!b.dead){ b.dead=true; part('cancel',b.x,b.y,rand(-10,10),-30,.5,C.gold,1); addScore(10); }
    player.inv=Math.max(player.inv,.2); G.shake=Math.max(G.shake,2);
    for(let i=0;i<3;i++) part('fire',rand(0,W),H+4,rand(-20,20),rand(-300,-200),rand(.5,1),pick([C.fire,C.fire2,C.gold]),rand(2,4)|0); } }
function evolve(){ const p=player;
  if(p.tails>=9){ addScore(5000); toast('구미호',pts(5000),null,1); SFX.item(); return; }
  p.tails++; G.maxTail=Math.max(G.maxTail,p.tails);
  if(p.tails===9){ awaken(); return; }
  const [a,b]=TAIL_INFO[p.tails]; toast(a,b,null,2); SFX.evolve(); vib([30,40,60]); G.slowT=.45;
  cancelBullets(p.x,p.y,70,true); part('ring',p.x,p.y,0,0,.5,C.gold,6,70); G.flash=.15; G.flashCol='#ffe29a';
  for(let i=0;i<24;i++){ const a2=i/24*TAU; part('spark',p.x,p.y,Math.cos(a2)*90,Math.sin(a2)*90,.5,C.gold,2); } }
function awaken(){ const p=player; toast('구미호 각성','아홉 꼬리 · 여우불 폭풍 해금','big',3); SFX.awaken(); vib([60,40,60,40,160]);
  G.slowT=1.4; p.awakenT=1.6; p.inv=3; cancelBullets(0,0,1e9,true); G.flash=.6; G.flashCol='#fff1d6'; G.shake=8;
  for(let i=0;i<3;i++) part('ring',p.x,p.y,0,0,.6+i*.25,i%2?C.gold:'#fff1d6',6,60+i*40);
  for(let i=0;i<40;i++){ const a=i/40*TAU; part('spark',p.x,p.y,Math.cos(a)*130,Math.sin(a)*130,.8,pick([C.gold,'#fff1d6',C.fire2]),2); } }
function pickup(t){ const p=player;
  if(t==='heal'){ p.hp=Math.min(p.maxHp,p.hp+20); SFX.heal(); toast('여우 떡','체력 +20',null,0); for(let i=0;i<12;i++) part('spark',p.x+rand(-6,6),p.y+rand(-6,6),rand(-20,20),rand(-60,-20),.6,pick(['#8fe07a','#e88fa0','#fff1d6']),1); }
  else if(t==='orb'){ if(p.orbs<7){ p.orbs++; toast('여우구슬 '+p.orbs+'개',ORB_INFO[p.orbs],null,1); } else { addScore(3000); toast('여우구슬 가득',pts(3000),null,0); }
    SFX.item(); part('ring',p.x,p.y,0,0,.4,'#bfe3ff',4,34); }
  else evolve(); }
function hurt(d){ if(!player.alive||player.inv>0||G.state!=='play'||G.god) return;
  player.hp=Math.max(0,player.hp-d); player.inv=1; G.hurtFlash=.45; G.shake=Math.max(G.shake,4); G.hitStop=.05; G.combo=0;
  SFX.hurt(); vib(70); cancelBullets(player.x,player.y,26,false);
  if(player.hp<=0) die(); }
function die(){ player.alive=false; G.state='dying'; G.dieT=2; G.beam=null; SFX.beamOff(); MUS.stop();
  explode(player.x,player.y,3); for(let i=0;i<3;i++) part('ring',player.x,player.y,0,0,.6+i*.2,C.fire2,4,40+i*20);
  G.shake=10; G.slowT=0; SFX.boom(); vib([100,60,200]); }

function nearestEnemy(x,y){ let best=null, bd=1e9; for(const e of enemies){ if(!valid(e)||e.y<-5||e.y>y+20) continue; const d=(e.x-x)**2+(e.y-y)**2; if(d<bd){ bd=d; best=e; } } return best; }
function updatePB(dt){ for(const b of PB.list){ if(b.dead) continue; b.t+=dt; b.life-=dt;
  if(b.homing&&b.t>.06){ const tg=nearestEnemy(b.x,b.y); if(tg){ const want=Math.atan2(tg.y-b.y,tg.x-b.x); let cur=Math.atan2(b.vy,b.vx); const d=((want-cur+Math.PI*3)%TAU)-Math.PI; cur+=clamp(d,-3.2*dt,3.2*dt); const sp=Math.hypot(b.vx,b.vy); b.vx=Math.cos(cur)*sp; b.vy=Math.sin(cur)*sp; } }
  b.x+=b.vx*dt; b.y+=b.vy*dt; if(b.life<=0||b.y<-12||b.y>H+12||b.x<-12||b.x>W+12) b.dead=true; } }
function updateEB(dt){ for(const b of EB.list){ if(b.dead) continue; b.t+=dt;
  if(b.w){ const c=Math.cos(b.w*dt), s=Math.sin(b.w*dt), vx=b.vx; b.vx=vx*c-b.vy*s; b.vy=vx*s+b.vy*c; }   // 휘는 탄
  if(b.acc&&b.vx*b.vx+b.vy*b.vy<200*200){ const k=1+b.acc*dt; b.vx*=k; b.vy*=k; }                     // 가속 탄
  b.x+=b.vx*dt; b.y+=b.vy*dt; if(b.kind==='club') b.rot+=dt*14;
  if(b.x<-10||b.x>W+10||b.y<-14||b.y>H+10){ b.dead=true; continue; }
  if(player.alive&&player.inv<=0){ const dx=b.x-player.x, dy=b.y-player.y, rr=b.r+1.6; if(dx*dx+dy*dy<rr*rr){ b.dead=true; hurt(10); } } } }
function updateEnemies(dt){ for(const e of enemies){ if(e.dead||e.gone) continue; e.t+=dt; e.flash=Math.max(-1,e.flash-dt); if(e.boss) updateBoss(e,dt); else EDEF[e.type].update(e,dt); }
  if(player.alive) for(const e of enemies){ if(e.dead||e.gone||e.invul||e.y<4) continue; const rr=e.r+3; if(dist2(e,player)<rr*rr){ hurt(20); if(!e.boss&&!e.parent) damageEnemy(e,10,'contact'); break; } }
  for(let i=enemies.length-1;i>=0;i--) if(enemies[i].dead||enemies[i].gone) enemies.splice(i,1); }
function splash(x,y){ part('glow',x,y,0,0,.18,C.fire,7); for(const e of enemies) if(valid(e)&&(e.x-x)**2+(e.y-y)**2<(13+e.r)**2) damageEnemy(e,.5*dmgMult(),'splash'); }
function collide(){
  for(const b of PB.list){ if(b.dead) continue;
    for(const e of enemies){ if(e.dead||e.gone||(e.invul&&!e.parent)||e.y<-8) continue; const rr=e.r+(b.kind==='rain'?3:2), dx=b.x-e.x, dy=b.y-e.y;
      if(dx*dx+dy*dy<rr*rr){ b.dead=true; damageEnemy(e,b.dmg,b.kind==='rain'?'rain':'shot'); part('spark',b.x,b.y,rand(-30,30),rand(-40,-10),.15,C.fire2,1); if(player.tails>=3&&b.kind!=='rain') splash(b.x,b.y); break; } }
    if(b.kind==='rain'&&!b.dead) for(const e2 of EB.list){ if(!e2.dead&&(e2.x-b.x)**2+(e2.y-b.y)**2<49){ e2.dead=true; part('cancel',e2.x,e2.y,0,-30,.4,C.gold,1); addScore(10); } } } }
function updateItems(dt){ for(const it of items){ if(it.dead) continue; it.t+=dt; const dx=player.x-it.x, dy=player.y-it.y, d=Math.hypot(dx,dy)||1;
  if(player.alive&&d<40){ it.x+=dx/d*170*dt; it.y+=dy/d*170*dt; }
  else { it.y+=30*dt; it.x+=it.vx*dt; if(it.x<12||it.x>W-12) it.vx*=-1; it.x=clamp(it.x,12,W-12); }
  if(player.alive&&d<11){ it.dead=true; pickup(it.type); }
  else if(it.y>H+12){ it.dead=true; if(it.type!=='heal') G.requeue.push({type:it.type,wait:4}); } } }
function updateParticles(dt){ for(const p of PT.list){ if(p.dead) continue; p.life-=dt; if(p.life<=0){ p.dead=true; continue; } if(p.drag!==1){ const k=Math.pow(p.drag,dt*60); p.vx*=k; p.vy*=k; } p.x+=p.vx*dt; p.y+=p.vy*dt; } }
function updateBossBoom(dt){ const B=G.bossBoom; if(!B) return; B.t+=dt; B.acc+=dt;
  while(B.acc>=.09&&B.t<1.8){ B.acc-=.09; const src=B.segs&&Math.random()<.5?pick(B.segs):B; explode(src.x+rand(-18,18),src.y+rand(-16,16),2); SFX.boom(); G.shake=Math.max(G.shake,4); }
  if(B.t>=1.8){ explode(B.x,B.y,3); part('ring',B.x,B.y,0,0,.8,'#fff1d6',10,120); G.bossBoom=null; } }
function runEvents(dt){ while(G.evIdx<G.events.length&&G.events[G.evIdx].t<=G.stageT) G.events[G.evIdx++].f();
  for(let i=G.later.length-1;i>=0;i--){ if(G.later[i].at<=G.stageT){ const l=G.later[i]; G.later.splice(i,1); l.fn(); } }
  for(let i=G.requeue.length-1;i>=0;i--){ const r=G.requeue[i]; r.wait-=dt; if(r.wait<=0){ G.requeue.splice(i,1); spawnItem(r.type); } } }

function step(dt){
  G.t+=dt; G.frame++;
  const inGame=G.state==='play'||G.state==='dying'||G.state==='clear';
  if(!inGame){ if(G.state==='title'||G.state==='nick'||(G.state==='rank'&&G.rankBack==='title')){ G.scroll+=18*dt; } updateParticles(dt); PT.sweep(); return; }
  if(G.hitStop>0){ G.hitStop-=dt; return; }
  let ts=1; if(G.slowT>0){ G.slowT-=dt; ts=.3; } if(G.state==='dying') ts=.5;
  const d=dt*ts;
  G.shake*=Math.pow(.85,dt*60); if(G.shake<.3) G.shake=0;
  G.flash=Math.max(0,G.flash-dt*2.2); G.hurtFlash=Math.max(0,G.hurtFlash-dt*1.6); G.warnT=Math.max(0,G.warnT-dt);
  G.scroll+=26*d;
  if(G.state==='play'){ G.runTime+=dt; if(!G.mid) G.stageT+=d; runEvents(d); }
  updatePlayer(d); updateSkills(d); updateBeam(d);
  updatePB(d); updateEnemies(d); updateEB(d); collide(); updateItems(d); updateParticles(d); updateBossBoom(d);
  if(G.comboT>0){ G.comboT-=d; if(G.comboT<=0) G.combo=0; }
  if(G.clearT>0&&G.state==='play'){ G.clearT-=dt; if(G.clearT<=0) nextStage(); }
  if(G.state==='dying'){ G.dieT-=dt; if(G.dieT<=0) showResult(false); }
  else if(G.state==='clear'){ G.resultT-=dt; if(G.resultT<=0) showResult(true); }
  PB.sweep(); EB.sweep(); PT.sweep(); for(let i=items.length-1;i>=0;i--) if(items[i].dead) items.splice(i,1);
}

// ================================================================
//  그리기
// ================================================================
// 꼬리는 머리 뒤로 부채처럼 펼쳐진다 (1개: 오른쪽 위로 말림 · 9개: 후광)
function tailAngles(n){ if(n===1) return [.95]; const S=Math.min(1.45,.5+.12*(n-1)), a=[]; for(let i=0;i<n;i++) a.push(-S+2*S*i/(n-1)); return a; }
function drawTails(x,y,n,form,t,swipe){ const [base,shade,tip,line,tipShade]=form.tail, angs=tailAngles(n), tails=[], N=9;
  for(let i=0;i<n;i++){ let th=angs[i]+Math.sin(t*2.6+i*1.1)*.08, len=form.L*(1.12-Math.abs(angs[i])*.1);
    if(swipe>0){ th+=(1-swipe/.4)*TAU; len*=1.35; }
    const side=th>=0?1:-1, pts=[]; let px=x, py=y;
    for(let s=0;s<=N;s++){ const f=s/N, r=f<.2?1.6+f*7:f>.8?3.3-(f-.8)*8.5:3+Math.sin((f-.2)/.6*Math.PI)*1.4;
      pts.push([px,py,r,f]); const dir=th+side*f*f*.8+Math.sin(t*3+i+f*3)*.1*f; px+=Math.sin(dir)*len/N; py-=Math.cos(dir)*len/N; }
    tails.push({pts,side}); }
  // 바깥 꼬리부터 한 개씩 그려서 꼬리마다 외곽선이 보이게 (가운데 꼬리가 맨 위)
  tails.sort((p,q)=>Math.abs(q.pts[N][0]-x)-Math.abs(p.pts[N][0]-x));
  const a0=ctx.globalAlpha;
  for(const T of tails){ const P=T.pts;
    for(const [px,py,r] of P) pc(ctx,px,py,r+1,line);
    for(const [px,py,r,f] of P) pc(ctx,px,py,r,f>.8?tip:base);
    for(const [px,py,r,f] of P) if(f>.15&&f<=.8&&r>2) pc(ctx,px+T.side*1.4,py+1.3,r-2.2,shade);
    for(const [px,py,r,f] of P) pc(ctx,px-T.side*.4,py-.4,Math.max(0,r-1.8),f>.8?tip:base);
    for(const [px,py,r,f] of P) if(f>.8&&r>1.5) pc(ctx,px+T.side*.9,py+.9,r-1.6,tipShade);
    ctx.globalAlpha=a0*.35; for(const [px,py,r,f] of P) if(f>.3&&f<.7&&r>3) pc(ctx,px-T.side*1,py-1.2,r-3.2,'#ffffff'); ctx.globalAlpha=a0; } }
// (x,y) = 가슴(판정점). 몸은 4px 위에 그리고, 1px씩 통통 뛰며 3.2초마다 눈을 깜빡인다
function drawFox(x,y,n,form,t,swipe){ const bob=Math.sin(t*5)>0?0:1; const a=ctx.globalAlpha;
  drawTails(x,y-1+bob,n,form,t,swipe||0); ctx.globalAlpha=a;

function debugKey(c){ const p=player, m=c.match(/^Digit([1-9])$/);
  if(m){ const n=+m[1]; if(n===9){ if(p.tails<9){ p.tails=8; evolve(); } } else { p.tails=n; G.maxTail=Math.max(G.maxTail,n); p.awakenT=0; if(n>1) toast(...TAIL_INFO[n],null,2); } return; }
  if(c==='KeyO'&&p.orbs<7){ p.orbs++; toast('여우구슬 '+p.orbs+'개',ORB_INFO[p.orbs],null,1); }
  if(c==='KeyB') p.gauge=100;
  if(c==='KeyN'&&G.clearT<=0){ if(G.boss) killEnemy(G.boss); else { G.evIdx=G.events.length; G.later=[]; G.warnT=0; for(const e of enemies) if(!e.boss) e.gone=true; spawnBoss(G.stage); } }
  if(c==='KeyH'){ p.inv=0; hurt(30); }
  if(c==='KeyK'){ const g=G.god; G.god=false; p.inv=0; p.hp=1; hurt(1); G.god=g; }
  if(c==='KeyG') G.god=!G.god;
  if(c==='KeyM'&&!G.boss&&!G.mid&&G.clearT<=0) spawnMid(G.stage); }

const BAD=['시발','씨발','씨바','병신','좆','존나','개새','새끼','미친','니미','느금','애미','에미','섹스','fuck','shit','bitch','sex','porn'];
function validNick(s){ if(!/^[가-힣a-zA-Z0-9]{2,10}$/.test(s)) return '2~10자의 한글·영문·숫자만 쓸 수 있어요'; const l=s.toLowerCase(); if(BAD.some(w=>l.includes(w))) return '다른 닉네임을 써 주세요'; return ''; }
async function fetchT(url,opt={},ms=6000){ const ac=new AbortController(), id=setTimeout(()=>ac.abort(),ms); try{ return await fetch(url,{...opt,signal:ac.signal}); } finally{ clearTimeout(id); } }
const Rank={
  online(){ return !!(CONFIG.SUPABASE_URL&&CONFIG.SUPABASE_ANON_KEY); },
  base(){ return CONFIG.SUPABASE_URL.replace(/\/+$/,'')+'/rest/v1/'; },
  hdr(extra){ return Object.assign({apikey:CONFIG.SUPABASE_ANON_KEY,Authorization:'Bearer '+CONFIG.SUPABASE_ANON_KEY},extra||{}); },
  saveLocal(rec){ const a=store.get('local',[]); if(a.some(r=>r.id===rec.id)) return; a.push(Object.assign({created_at:new Date().toISOString()},rec)); a.sort((x,y)=>y.score-x.score); store.set('local',a.slice(0,200)); },
  best(rows){ const m=new Map(); for(const r of rows){ const o=m.get(r.nickname); if(!o||r.score>o.score) m.set(r.nickname,r); }
    const a=[...m.values()].sort((x,y)=>y.score-x.score); a.forEach(r=>{ r.rank=1+a.filter(o=>o.score>r.score).length; }); return a; },
  // 제출 실패분은 보관했다가 재전송. 기록마다 고유 id가 있어 409(이미 있음)는 성공으로 본다.
  async flush(){ if(!this.online()) return false; const pend=store.get('pending',[]); if(!pend.length) return true; const remain=[];
    for(const rec of pend){ try{ const r=await fetchT(this.base()+'scores',{method:'POST',headers:this.hdr({'Content-Type':'application/json',Prefer:'return=minimal'}),body:JSON.stringify(rec)});
        if(r.ok||r.status===409) continue; if(r.status===400||r.status===422){ console.warn('ranking: 서버가 기록을 거부했습니다',r.status); continue; } remain.push(rec); }
      catch(e){ remain.push(rec); } }
    store.set('pending',remain); return remain.length===0; },
  async board(){ if(this.online()){ try{ const r=await fetchT(this.base()+'leaderboard?select=nickname,score,max_tail,stage,clear_time_ms,difficulty,created_at&order=score.desc,created_at.asc&limit=1000',{headers:this.hdr()});
        if(r.ok){ const rows=await r.json(); if(Array.isArray(rows)) return {online:true,rows:this.best(rows)}; } }catch(e){} }
    return {online:false,rows:this.best(store.get('local',[]))}; },
  async submit(rec){ this.saveLocal(rec); if(this.online()){ const p=store.get('pending',[]); if(!p.some(r=>r.id===rec.id)){ p.push(rec); store.set('pending',p); } await this.flush(); }
    const bd=await this.board(); const others=bd.rows.filter(r=>r.nickname!==rec.nickname);
    const me=bd.rows.find(r=>r.nickname===rec.nickname);
    return {online:bd.online,rank:1+others.filter(r=>r.score>rec.score).length,bestRank:me?me.rank:null,total:bd.rows.length}; }
};

  const el=$('toast'); el.className=''; el.querySelector('.t1').textContent=a; el.querySelector('.t2').textContent=b||''; void el.offsetWidth; el.className='show'+(cls?' '+cls:''); }
function show(id){ for(const s of document.querySelectorAll('.scr')) s.hidden=s.id!==id; }
function soundLabel(){ const t=AU.muted?'소리 끔':'소리 켬'; $('bSound').textContent=t; $('bSound2').textContent=t; }
function toTitle(){ G.state='title'; MUS.stop(); SFX.beamOff(); G.beam=null; $('whoNick').textContent=NICK; soundLabel();
  $('hint').textContent=TOUCH?'드래그로 이동 · 자동 사격 · 오른쪽 아래 버튼으로 빔':'방향키/WASD 이동 · 자동 사격 · X 빔 · Shift 정밀 · P 일시정지';
  const mine=store.get('local',[]).filter(r=>r.nickname===NICK); $('bestLine').textContent=mine.length?'내 최고 기록 '+Math.max(...mine.map(r=>r.score)).toLocaleString()+'점':'';
  updDiff(); show('titleScr'); }
function updDiff(){ for(const b of document.querySelectorAll('.dbtn')){ const on=b.dataset.d===DF.key; b.classList.toggle('on',on); b.setAttribute('aria-checked',on); } $('diffDesc').textContent=DF.desc; }
function setDiff(k){ DF=DIFF[k]||DIFF.easy; store.set('diff',DF.key); updDiff(); }
function toNick(cancelable){ G.state='nick'; $('nickIn').value=NICK; $('nickErr').textContent=''; $('nickCancel').hidden=!cancelable; show('nickScr'); setTimeout(()=>{ try{$('nickIn').focus();}catch(e){} },60); }
function startGame(){ AU.init(); PB.clear(); EB.clear(); PT.clear(); enemies.length=0; items.length=0; chunkCache.clear(); SFX.beamOff();
  Object.assign(G,{stage:1,stageT:0,scroll:0,score:0,combo:0,comboT:0,maxCombo:0,hitStop:0,shake:0,slowT:0,flash:0,hurtFlash:0,later:[],requeue:[],boss:null,warnT:0,clearT:0,dieT:0,resultT:0,runTime:0,maxTail:1,beam:null,rainT:0,rain:0,rainAcc:0,swipeT:0,swipe:0,readyShown:false,bossBoom:null,mid:null});
  biomeMarks=[{k:0,b:1}]; treeMarks=[{b:-1e9,biome:1}];
  player=newPlayer(); moveId=null; G.state='play'; show(null); startStage(1); }
function pauseGame(){ if(G.state!=='play') return; G.state='pause'; MUS.stop(); SFX.beamOff(); moveId=null; soundLabel(); show('pauseScr'); }
function resume(){ if(G.state!=='pause') return; AU.init(); G.state='play'; show(null); if(G.warnT<=0&&G.clearT<=0) MUS.play(G.boss?'boss':'stage'); if(G.beam) SFX.beamOn(); last=performance.now(); }
async function showResult(cleared){ if(G.state==='result') return; G.state='result'; MUS.stop(); SFX.beamOff(); if(!cleared) SFX.over();
  const rec={id:uuid(),nickname:NICK,score:Math.floor(G.score),max_tail:G.maxTail,stage:G.stage,clear_time_ms:cleared?Math.round(G.runTime*1000):null,difficulty:DF.key};
  $('resTitle').textContent=cleared?'클리어!':'게임 오버';
  const tm=s=>Math.floor(s/60)+'분 '+String(Math.floor(s%60)).padStart(2,'0')+'초';
  const st=[['점수',rec.score.toLocaleString()],['난이도',DF.name+' (점수 ×'+DF.score+')'],['도달',cleared?'3장 완주':G.stage+'장'],['꼬리',rec.max_tail+'개'],['최대 콤보',G.maxCombo],['플레이 시간',tm(G.runTime)]];
  $('resStats').innerHTML=st.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('');
  $('resRank').innerHTML='순위 확인 중…'; show('resultScr');
  let r; try{ r=await Rank.submit(rec); }catch(e){ r=null; }
  if(!r){ $('resRank').innerHTML='순위를 불러오지 못했어요'; return; }
  $('resRank').innerHTML=`이번 기록 ${r.rank}위 <small>${r.online?'온라인 랭킹':'오프라인 랭킹 (이 기기)'}${r.bestRank?' · 내 최고 기록 '+r.bestRank+'위':''} · 참가 ${r.total}명</small>`; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function openRank(from){ G.rankBack=from; G.state='rank'; show('rankScr'); $('rankMode').textContent=''; $('rankList').innerHTML='<li class="empty">불러오는 중…</li>';
  const bd=await Rank.board(); if(G.state!=='rank') return;
  $('rankMode').textContent=bd.online?'온라인':'오프라인 · 이 기기'; $('rankMode').className='tag'+(bd.online?'':' off');
  const row=r=>`<li class="${r.nickname===NICK?'me':''}"><span class="rk">${r.rank}</span><span class="nm">${esc(r.nickname)}</span><span class="tl"><b class="df df-${(DIFF[r.difficulty]||DIFF.easy).tag}">${(DIFF[r.difficulty]||DIFF.easy).name}</b> 꼬리 ${r.max_tail}${r.clear_time_ms!=null?' <b class="cl">완주</b>':''}</span><span class="sc">${Number(r.score).toLocaleString()}</span></li>`;
  const top=bd.rows.slice(0,20); let html=top.map(row).join('');
  const me=bd.rows.find(r=>r.nickname===NICK); if(me&&!top.includes(me)) html+='<li class="gap">⋯</li>'+row(me);
  $('rankList').innerHTML=html||'<li class="empty">아직 기록이 없어요. 첫 기록을 남겨 보세요!</li>'; }
function closeRank(){ if(G.rankBack==='result'){ G.state='result'; show('resultScr'); } else toTitle(); }

$('nickForm').addEventListener('submit',e=>{ e.preventDefault(); const v=$('nickIn').value.trim(), err=validNick(v);
  if(err){ $('nickErr').textContent=err; return; } NICK=v; store.set('nick',v); AU.init(); SFX.click(); toTitle(); });
$('nickCancel').onclick=()=>{ SFX.click(); toTitle(); };
$('bStart').onclick=()=>{ AU.init(); SFX.click(); startGame(); };
$('bRank').onclick=()=>{ SFX.click(); openRank('title'); };
$('bNick').onclick=()=>{ SFX.click(); toNick(true); };
for(const b of document.querySelectorAll('.dbtn')) b.onclick=()=>{ AU.init(); SFX.click(); setDiff(b.dataset.d); };
$('bSound').onclick=$('bSound2').onclick=()=>{ AU.init(); AU.setMute(!AU.muted); soundLabel(); SFX.click(); };
$('bResume').onclick=()=>{ SFX.click(); resume(); };
$('bQuit').onclick=()=>{ SFX.click(); toTitle(); };
$('bRetry').onclick=()=>{ SFX.click(); startGame(); };
$('bRank2').onclick=()=>{ SFX.click(); openRank('result'); };
$('bHome').onclick=()=>{ SFX.click(); toTitle(); };
$('bRankClose').onclick=()=>{ SFX.click(); closeRank(); };

// ================================================================
//  메인 루프 (고정 60Hz 갱신)
// ================================================================
let last=performance.now(), acc=0;
const STEP=1/60;
function frame(now){ requestAnimationFrame(frame); let dt=(now-last)/1000; last=now; if(dt>.1) dt=.1; if(dt>0) G.fps=lerp(G.fps,1/dt,.05);
  acc+=dt; let n=0; while(acc>=STEP&&n<5){ step(STEP); acc-=STEP; n++; } if(n===5) acc=0; render(); }
addEventListener('resize',resize); addEventListener('orientationchange',()=>setTimeout(resize,200)); if(window.visualViewport) visualViewport.addEventListener('resize',resize);
addEventListener('online',()=>Rank.flush());
resize();
if(NICK&&!validNick(NICK)) toTitle(); else toNick(false);
Rank.flush();
requestAnimationFrame(frame);
if(DEBUG) window.__g={G,get player(){return player;},get H(){return H;},W,enemies,items,EB,PB,Rank,startGame,spawnItem,toTitle,step,CONFIG,DIFF,setDiff,spawnMid,spawnEnemy,killEnemy,get DF(){return DF;},get biomeMarks(){return biomeMarks;},sheet(on){ G.sheet=on; show(on?null:'titleScr'); }};
</script>
</body>
